# Fast, repository-owned static checks for April Writer packaging. These jobs do not build or
# publish application artifacts and receive no credentials beyond read-only source access.
name: Packaging lint

on:
  push:
    branches: [april/main]
    paths:
      - ".github/workflows/**"
      - "packaging/**"
      - "assets/app-icon/**"
      - "assets/april/**"
  pull_request:
    branches: [april/main]
    paths:
      - ".github/workflows/**"
      - "packaging/**"
      - "assets/app-icon/**"
      - "assets/april/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    name: Packaging metadata and scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned validation tools
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils libxml2-utils python3-yaml shellcheck
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --proto-redir =https -fsSL \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$archive" actionlint

      - name: Validate GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color

      - name: Check packaging shell scripts
        run: |
          find packaging -type f -name '*.sh' -print0 \
            | xargs -0 --no-run-if-empty shellcheck

      - name: Parse packaging PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem packaging/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Output "::error file=$($file.Name)::$_" }
              exit 1
            }
            Write-Output "ok $($file.Name)"
          }

      - name: Validate XML and platform metadata
        run: |
          mapfile -d '' xml_files < <(
            find packaging/windows packaging/macos packaging/linux -type f \
              \( -name '*.wxs' -o -name '*.wxl' -o -name '*.plist' -o -name '*.plist.in' \
                 -o -name '*.xml' -o -name '*.xml.in' \) -print0
          )
          if ((${#xml_files[@]})); then
            xmllint --noout "${xml_files[@]}"
          fi
          desktop-file-validate packaging/linux/com.aprilsoftware.aprilwriter.desktop
          sed -e 's/@VERSION@/0.0.0/g' -e 's/@DATE@/2026-01-01/g' \
            packaging/linux/com.aprilsoftware.aprilwriter.metainfo.xml.in \
            > "$RUNNER_TEMP/com.aprilsoftware.aprilwriter.metainfo.xml"
          appstreamcli validate --no-net --explain \
            "$RUNNER_TEMP/com.aprilsoftware.aprilwriter.metainfo.xml"

      - name: Check Flatpak manifest policy parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          root = Path("packaging/linux/flatpak")
          source = yaml.safe_load((root / "com.aprilsoftware.aprilwriter.yml").read_text())
          bundle = yaml.safe_load((root / "com.aprilsoftware.aprilwriter.bundle.yml").read_text())
          for key in ("runtime", "runtime-version", "sdk", "finish-args"):
              assert source.get(key) == bundle.get(key), f"Flatpak manifests disagree on {key}"
          print("Flatpak manifests agree on runtime and sandbox policy")
          PY

      - name: Check April packaging identity
        run: |
          test -f packaging/linux/com.aprilsoftware.aprilwriter.desktop
          test -f packaging/windows/aprilwriter.wxs
          test ! -e packaging/windows/wordcraft.wxs
          grep -Fqx 'Exec=aprilwriter %F' packaging/linux/com.aprilsoftware.aprilwriter.desktop
          grep -Fq '<id>com.aprilsoftware.aprilwriter</id>' \
            packaging/linux/com.aprilsoftware.aprilwriter.metainfo.xml.in
          grep -Fq '<string>com.aprilsoftware.aprilwriter</string>' packaging/macos/Info.plist.in
          grep -Fq '<Package Name="April Writer" Manufacturer="April Software S.A."' \
            packaging/windows/aprilwriter.wxs
          grep -Fq 'NAME="aprilwriter-web-$VERSION"' packaging/web/package.sh

  windows-install-policy:
    timeout-minutes: 10
    name: Windows installation policy (no app build)
    runs-on: windows-latest
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned packaging toolchain
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'aprilwriter-install-policy-wix'
          dotnet tool install --tool-path $tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $tools >> $env:GITHUB_PATH
          $policy = Get-Content -Raw -LiteralPath packaging/windows/install-policy.json | ConvertFrom-Json
          foreach ($extension in @($policy.extensions)) {
            & (Join-Path $tools 'wix.exe') extension add -g "WixToolset.$extension.wixext/5.0.2"
            if ($LASTEXITCODE -ne 0) { throw "WiX extension $extension installation failed." }
          }

      - name: Build and check non-executable installer fixtures
        shell: pwsh
        run: ./packaging/windows/test-install-policy.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'aprilwriter-install-policy-tests')
