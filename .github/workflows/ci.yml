name: CI

# April Writer's primary source gate. The workflow logic lives in this repository so an upstream
# reusable workflow cannot change an April build without review here.
on:
  push:
    branches: [april/main]
  pull_request:
    branches: [april/main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; accepted branch runs finish independently.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-gate:
    name: April Writer source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev \
            mesa-vulkan-drivers

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: aprilwriter-source-v1
          cache-on-failure: true

      - name: Run the repository quality gate
        run: cargo xtask ci

      - name: Verify the lockfile is unchanged
        run: git diff --exit-code -- Cargo.lock
