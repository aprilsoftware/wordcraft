# Build, test and package April Writer inside a real FreeBSD VM. This first April-owned FreeBSD
# gate is native x86-64; aarch64 cross-compilation remains a separate qualification increment.
name: FreeBSD

on:
  push:
    branches: [april/main]
    paths:
      - ".github/workflows/freebsd.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/**"
      - "crates/**"
      - "packaging/env.sh"
      - "packaging/freebsd/**"
      - "packaging/linux/**"
      - "assets/app-icon/**"
      - "NOTICE"
      - "ATTRIBUTION.md"
      - "LICENSE-*"
  pull_request:
    branches: [april/main]
    paths:
      - ".github/workflows/freebsd.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/**"
      - "crates/**"
      - "packaging/env.sh"
      - "packaging/freebsd/**"
      - "packaging/linux/**"
      - "assets/app-icon/**"
      - "NOTICE"
      - "ATTRIBUTION.md"
      - "LICENSE-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd-x86-64:
    name: FreeBSD 15.1 x86-64 build, test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_HOME: /var/tmp/aprilwriter-cargo
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: /var/tmp/aprilwriter-target
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, test, and package in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          arch: x86_64
          usesh: true
          cpu: 4
          mem: 12288
          sync: rsync
          copyback: true
          envs: "CARGO_BUILD_JOBS CARGO_HOME CARGO_INCREMENTAL CARGO_TARGET_DIR"
          prepare: |
            unset CARGO_HOME CARGO_TARGET_DIR
            pkg install -y \
              bash git curl pkgconf cmake-core python3 \
              libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb \
              mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib dejavu
            curl --proto '=https' --proto-redir =https -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          run: |
            set -eu
            . "$HOME/.cargo/env"
            git config --global --add safe.directory '*'
            rustc --version | grep -E '^rustc 1\.95\.0 '
            cargo --version

            mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
            CARGO_PROFILE_DEV_DEBUG=0 cargo build --workspace --all-targets --locked

            id april-test >/dev/null 2>&1 || pw useradd april-test -m -s /bin/sh
            rustup_home=${RUSTUP_HOME:-$HOME/.rustup}
            chmod 755 /root
            chown -R april-test "$CARGO_HOME" "$CARGO_TARGET_DIR" "$PWD"
            HOME=/home/april-test RUSTUP_HOME="$rustup_home" su -m april-test -c '
              set -eu
              cd "$GITHUB_WORKSPACE"
              CARGO_PROFILE_DEV_DEBUG=0 cargo test --workspace --locked
            '

            package_output=$(bash packaging/freebsd/package.sh)
            printf '%s\n' "$package_output"
            printf '%s\n' "$package_output" | grep -Eq '^aprilwriter-cli [^[:space:]]+$' \
              || { echo 'error: packaged aprilwriter-cli --version identity smoke failed' >&2; exit 1; }

            set -- dist/release/aprilwriter-*-freebsd-x86_64.tar.gz
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "error: expected exactly one April Writer FreeBSD x86-64 archive" >&2
              exit 1
            fi
            archive=$1
            base=$(basename "$archive" .tar.gz)
            tar -tzf "$archive" > /tmp/aprilwriter-archive.txt
            for required in \
              "$base/bin/aprilwriter" \
              "$base/bin/aprilwriter-cli" \
              "$base/share/applications/com.aprilsoftware.aprilwriter.desktop" \
              "$base/share/mime/packages/com.aprilsoftware.aprilwriter.xml" \
              "$base/share/metainfo/com.aprilsoftware.aprilwriter.metainfo.xml" \
              "$base/share/doc/aprilwriter/NOTICE" \
              "$base/share/doc/aprilwriter/ATTRIBUTION.md"
            do
              grep -Fx "$required" /tmp/aprilwriter-archive.txt >/dev/null \
                || { echo "error: archive is missing $required" >&2; exit 1; }
            done
            grep -F "$base/share/icons/hicolor/" /tmp/aprilwriter-archive.txt >/dev/null \
              || { echo 'error: archive has no hicolor icons' >&2; exit 1; }
            echo "PASS FreeBSD package: $archive"

      - name: Upload short-lived qualification artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aprilwriter-freebsd-x86_64
          path: dist/release/aprilwriter-*-freebsd-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
